<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokun Shop - Carrito</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <div class="wrapper">
        <header class="header-mobile">
            <h1 class="logo">KokunShop</h1>
            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>
        </header>
        <aside>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>
            <header>
                <h1 class="logo">KokunShop</h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <a class="boton-menu boton-volver" href="./index.html">
                            <i class="bi bi-arrow-return-left"></i> Seguir comprando
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu" href="./login.html">
                            <i class="bi bi-person-fill"></i> Mi Cuenta
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito active" href="./carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito
                        </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2026 Kokun Shop</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal">Carrito</h2>
            <div class="contenedor-carrito">
                <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío.</p>

                <div id="carrito-productos" class="carrito-productos disabled">
                </div>

                <div id="carrito-acciones" class="carrito-acciones disabled">
                    <div class="carrito-acciones-izquierda">
                        <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar carrito</button>
                    </div>
                    <div class="carrito-acciones-derecha">
                        <div class="carrito-acciones-total">
                            <p>Total:</p>
                            <p id="total"></p>
                        </div>
                        <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
                    </div>
                </div>

                <p id="carrito-comprado" class="carrito-comprado disabled">Muchas gracias por tu compra.</p>

                <div id="checkout-modal" class="checkout-modal hidden">
                    <div class="checkout-modal-content">
                        <span id="close-checkout" class="close-checkout">&times;</span>
                        <h3>Detalles de Pago y Envío</h3>
                        <form id="checkout-form">
                            <div class="form-group">
                                <label for="direccion">Dirección de Envío</label>
                                <input type="text" id="direccion" required placeholder="Calle, Número, Ciudad">
                            </div>
                            <div class="form-group">
                                <label for="tarjeta">Número de Tarjeta</label>
                                <input type="text" id="tarjeta" required pattern="\d{16}" maxlength="16"
                                    placeholder="0000 0000 0000 0000">
                            </div>
                            <div class="form-group checkout-doble">
                                <div class="half">
                                    <label for="vencimiento">Vencimiento (MM/AA)</label>
                                    <input type="text" id="vencimiento" required pattern="\d{2}/\d{2}"
                                        placeholder="MM/AA" maxlength="5">
                                </div>
                                <div class="half">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" required pattern="\d{3,4}" placeholder="123"
                                        maxlength="4">
                                </div>
                            </div>
                            <button type="submit" class="boton-confirmar-compra">Confirmar Compra</button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/menu.js"></script>
</body>

</html>
