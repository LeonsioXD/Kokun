<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokun Shop - Mi Cuenta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/main.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            color: var(--clr-main);
            font-weight: 500;
        }

        .auth-btn {
            border: 0;
            background-color: var(--clr-main);
            color: var(--clr-white);
            padding: 1rem;
            text-transform: uppercase;
            border-radius: 1rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
            transition: background-color .2s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .auth-switch {
            text-align: center;
            color: var(--clr-main);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <header class="header-mobile">
            <h1 class="logo">Kokun Shop</h1>
            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>
        </header>
        <aside>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>
            <header>
                <h1 class="logo">Kokun Shop</h1>
            </header>
            <nav>
                <ul class="menu">
                    <li>
                        <a class="boton-menu boton-volver" href="./index.html">
                            <i class="bi bi-arrow-return-left"></i> Volver a inicio
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu active" href="./login.html">
                            <i class="bi bi-person-fill"></i> Mi Cuenta
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito" href="./carrito.html">
                            <i class="bi bi-cart-fill"></i> Carrito
                        </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">© 2026 Kokun Shop</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal" id="form-title">Iniciar Sesión</h2>

            <div class="auth-container">
                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Correo electrónico</label>
                        <input type="email" id="login-email" class="input-busqueda" placeholder="correo@ejemplo.com"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-password">Contraseña</label>
                        <input type="password" id="login-password" class="input-busqueda" placeholder="********"
                            required>
                    </div>
                    <button type="submit" class="auth-btn" style="width: 100%;">Ingresar</button>
                    <p class="auth-switch" id="go-to-register">¿No tienes cuenta? Regístrate</p>
                </form>

                <form id="register-form" class="hidden">
                    <div class="form-group">
                        <label class="form-label" for="register-name">Nombre</label>
                        <input type="text" id="register-name" class="input-busqueda" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="register-email">Correo electrónico</label>
                        <input type="email" id="register-email" class="input-busqueda" placeholder="correo@ejemplo.com"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="register-password">Contraseña</label>
                        <input type="password" id="register-password" class="input-busqueda" placeholder="********"
                            required>
                    </div>
                    <button type="submit" class="auth-btn" style="width: 100%;">Registrarse</button>
                    <p class="auth-switch" id="go-to-login">¿Ya tienes cuenta? Inicia sesión</p>
                </form>

                <div id="profile-container" class="hidden">
                    <h3 style="color: var(--clr-main); text-align: center; margin-bottom: 1rem;">¡Hola, <span
                            id="profile-name"></span>!</h3>

                    <div
                        style="background-color: var(--clr-gray); border-radius: 1rem; padding: 1.5rem; margin-bottom: 2rem;">
                        <h4
                            style="color: var(--clr-main); margin-bottom: 1rem; border-bottom: 2px solid var(--clr-main); padding-bottom: 0.5rem;">
                            Mi Historial de Compras</h4>
                        <div id="purchase-history" style="display: flex; flex-direction: column; gap: 1rem;">
                        </div>
                    </div>

                    <button id="logout-btn" class="carrito-acciones-vaciar" style="width: 100%;">Cerrar Sesión</button>
                </div>
            </div>
        </main>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/login.js"></script>
</body>

</html>
